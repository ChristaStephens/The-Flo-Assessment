<!DOCTYPE html>
<html lang="en" style="height: 100%">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>TymFlo Design System</title>
    <meta name="description" content="TymFlo brand design system preview." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400..800;1,400..800&family=Spectral:ital,wght@0,400..700;1,400..700&display=swap" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400..800;1,400..800&family=Spectral:ital,wght@0,400..700;1,400..700&display=swap" /></noscript>
    <style>
      @font-face { font-family: "Better Sabrina"; src: url("/tymflo-design-system/fonts/better-sabrina.woff2") format("woff2"); font-display: swap; }
      @font-face { font-family: "Montserrat Local"; src: url("/tymflo-design-system/fonts/montserrat-regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
      @font-face { font-family: "Montserrat Local"; src: url("/tymflo-design-system/fonts/montserrat-semibold.ttf") format("truetype"); font-weight: 600; font-display: swap; }
      @font-face { font-family: "Montserrat Local"; src: url("/tymflo-design-system/fonts/montserrat-bold.ttf") format("truetype"); font-weight: 700; font-display: swap; }
      @font-face { font-family: "Spectral Local"; src: url("/tymflo-design-system/fonts/spectral-regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
      @font-face { font-family: "Spectral Local"; src: url("/tymflo-design-system/fonts/spectral-medium-italic.ttf") format("truetype"); font-weight: 500; font-style: italic; font-display: swap; }
    </style>
  </head>
  <body style="height: 100%; margin: 0">
    <div id="root" style="height: 100%"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
